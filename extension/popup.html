<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="light dark" />
  <title>Media Control</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <h1 class="wordmark">Media Control<span id="count" class="count" hidden></span></h1>
    <div class="header-actions">
      <button id="pause-all" class="text-btn" type="button" title="Pause media in every tab">Pause all</button>
      <button id="mute-all" class="text-btn" type="button" title="Mute or unmute every listed tab">Mute all</button>
      <button id="settings-toggle" class="icon-btn gear" type="button" title="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" class="settings" inert>
    <div class="settings-inner">
      <div class="setting">
        <div class="setting-text">
          <label for="set-autopause">Auto-pause on open</label>
          <p>Pauses every playing tab when the popup opens.</p>
        </div>
        <input type="checkbox" id="set-autopause" class="switch" />
      </div>
      <div class="setting">
        <div class="setting-text">
          <label for="set-badge">Playing-count badge</label>
          <p>Toolbar icon shows how many tabs are making sound.</p>
        </div>
        <input type="checkbox" id="set-badge" class="switch" />
      </div>
      <div class="setting">
        <div class="setting-text">
          <label for="set-recent">Recently playing</label>
          <p>Paused media tabs stay listed for this browser session.</p>
        </div>
        <input type="checkbox" id="set-recent" class="switch" />
      </div>
      <p class="settings-note">Settings are stored on this device only.</p>
    </div>
  </section>

  <ul id="list" class="list" aria-label="Tabs playing media"></ul>

  <div id="empty" class="empty">
    <div class="empty-zero" aria-hidden="true">0</div>
    <p class="empty-label">Nothing playing</p>
    <p class="empty-hint">Start a video or song in any tab&nbsp;&mdash; it appears here.</p>
  </div>

  <footer class="footer">
    <span id="hints" class="footer-hints"></span>
    <span id="target-readout" class="footer-target"></span>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
